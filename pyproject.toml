[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-recovery"
version = "0.1.0"
description = "A bounded, approval-controlled logistics recovery prototype"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "jinja2", "pydantic>=2", "langgraph", "langgraph-checkpoint-sqlite", "httpx", "python-multipart"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
logistics-recovery = "logistics_recovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
logistics_recovery = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
